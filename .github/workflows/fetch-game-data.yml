name: Fetch Steam Game Data

on:
  workflow_call:
    inputs:
      trigger_source:
        description: "Source of the trigger: manual, scheduled, or push"
        required: false
        type: string
        default: "push"

  workflow_dispatch:
    inputs:
      trigger_source:
        description: "Source of the trigger: manual, scheduled, or push"
        required: false
        type: string
        default: "manual"

permissions:
  contents: write

jobs:
  fetch-data:
    runs-on: ubuntu-latest

    steps:
      # Get Python scripts from main
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Copy Python scripts
        run: |
          mkdir -p /tmp/scripts
          cp fetch_game_data.py update_top_owners.py /tmp/scripts/

      # Switch working directory to user branch
      - name: Checkout user branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: user

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml playwright
          playwright install

      - name: Update TOP_OWNER_IDS (scheduled only)
        if: ${{ github.event_name == 'schedule' }}
        run: python /tmp/scripts/update_top_owners.py

      - name: Fetch game data
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_BEFORE: ${{ github.event.before }}
          TRIGGER_SOURCE: ${{ inputs.trigger_source }}
        run: python /tmp/scripts/fetch_game_data.py

      - name: Commit changes
        run: |
          set -e

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # Get latest user branch changes
          git fetch origin user

          # Merge remote changes into our local user branch
          git merge origin/user -X ours --no-edit || true

          # Resolve any remaining conflicts using the remote version
          git diff --name-only --diff-filter=U | while read -r file; do
            echo "Resolving conflict: $file"
            git checkout --theirs -- "$file"
          done

          # Stage all generated AppID data.
          # -A includes modified, new and deleted files.
          git add -A AppID/

          # Stage main game data file
          if [ -f game-data.json ]; then
            git add game-data.json
          fi

          # Stage top owners if it exists
          if [ -f top_owners.json ]; then
            git add top_owners.json
          fi

          echo "Git status after staging:"
          git status --short

          # Only commit if there are STAGED changes
          if git diff --cached --quiet; then
            echo "No changes to commit to user branch"
          else
            echo "Changes detected. Creating commit..."
            git commit -m "Update game data [skip ci]"

            echo "Pushing changes to user branch..."
            git push origin user
          fi
